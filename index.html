<!DOCTYPE html>
<html lang="ja" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<script>
/* 画面サイズ判定（描画前に実行）：自動＝幅900px以上でPC表示、未満でスマホ表示。手動切替の設定があればそれを優先 */
(function(){var v;try{var p=JSON.parse(localStorage.getItem('viewPref')||'"auto"');v=(p==='pc'||p==='mobile')?p:(innerWidth>=900?'pc':'mobile');}catch(e){v=innerWidth>=900?'pc':'mobile';}document.documentElement.className+=' v-'+v;})();
</script>
<script>
window.addEventListener('error', function(e){ var el=document.getElementById('boot-err'); if(el) el.textContent='Error: '+(e.message||'')+' (line '+(e.lineno||'?')+')'; });
</script>
<title>Applicant Matching & Slot Management</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; background:#f4f6f9; color:#222; margin:0;
         padding:10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  button, label { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

  /* ===== 画面の「幅」だけで自動調整（端末判定に頼らない） ===== */
  .container { width:100%; max-width:1180px; margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0 4px; flex-wrap:wrap; }
  h1 { font-size:clamp(.95rem, 2.4vw, 1.3rem); color:#1e3a8a; margin:0; flex:1 1 220px; }
  #lang-select, #view-select { width:auto; padding:6px 8px; font-size:.9rem; border:1px solid #94a3b8; border-radius:6px; background:#fff; }
  h2 { font-size:1rem; color:#1e3a8a; margin:0 0 10px; }

  .tabs { display:flex; gap:4px; margin:8px 0 12px; position:sticky; top:0; z-index:20; background:#f4f6f9; padding-top:6px; }
  .tab-btn { flex:1; padding:12px 4px; border:none; border-radius:8px 8px 0 0; background:#dbe3f3; color:#1e3a8a; font-weight:bold; font-size:clamp(.75rem, 2vw, .95rem); cursor:pointer; }
  .tab-btn.active { background:#1e3a8a; color:#fff; }
  .tab { display:none; }
  .tab.active { display:block; }
  /* 幅が足りれば2列、足りなければ1列に自動で切り替わる */
  #tab-input.active, #tab-list.active, #tab-search.active { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap:16px; align-items:start; }
  #factory-admin { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap:12px; align-items:start; }
  #factory-admin .factory-card { margin-bottom:0; }
  #match-area { min-width:0; }

  .box { background:#fff; padding:clamp(12px, 2.5vw, 20px); border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1); margin-bottom:15px; min-width:0; }
  #tab-input.active > .box, #tab-list.active > .box, #tab-search.active > .box { margin-bottom:0; }
  a.btn { text-decoration:none; text-align:center; }
  .cand-card { border-left-color:#7c3aed; }
  .cand-card.s-great { border-left-color:#16a34a; }

  /* ===== 面接フォーム ===== */
  .form-head { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; flex-wrap:wrap; border-bottom:2px solid #1a3a5f; margin-bottom:10px; padding-bottom:8px; }
  .form-head h2 { text-transform:uppercase; font-size:1.2rem; margin:0; color:#1a3a5f; }
  .head-date { font-size:.9rem; font-weight:bold; }
  .section-title { background:#f1f3f5; padding:5px 10px; border-left:4px solid #1a3a5f; font-weight:bold; font-size:.8rem; margin:14px 0 8px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .jp-label { font-size:.72rem; color:#555; font-weight:normal; }
  .g { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 150px), 1fr)); margin-bottom:10px; }
  .g.w2 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
  .field { display:flex; flex-direction:column; min-width:0; margin-bottom:0; }
  .field > label.t { font-weight:bold; font-size:.82rem; margin-bottom:4px; }
  .req { color:#dc2626; font-size:.75rem; margin-left:4px; }
  input[type=text], input[type=tel], input[type=number], input[type=time], select, textarea {
    width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:1rem; background:#fff; font-family:inherit; min-width:0; }
  textarea { min-height:90px; resize:vertical; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .option-card { display:flex; align-items:center; gap:6px; font-size:.88rem; cursor:pointer; border:1px solid #cbd5e1; padding:8px 10px; border-radius:6px; background:#fff; font-weight:normal; margin:0; }
  .option-card input { width:18px; height:18px; margin:0; flex:none; }
  .option-card:has(input:checked) { background:#e0e7ff; border-color:#1e3a8a; font-weight:bold; }
  .option-card.on { background:#e0e7ff; border-color:#1e3a8a; font-weight:bold; }
  .opts input[type=text] { flex:1 1 140px; width:auto; }
  .sub-opt { margin:6px 0 0 18px; }
  .footer-note { background:#fff5f5; border:1px solid #fab1a0; color:#c0392b; padding:8px; margin-top:14px; border-radius:4px; font-size:.82rem; text-align:center; line-height:1.6; }
  .hint { font-size:.76rem; color:#64748b; margin-top:3px; min-height:1em; }
  .hint.warn { color:#b45309; }
  .hint.ok { color:#166534; }

  .btn { display:block; width:100%; padding:13px; border:none; border-radius:6px; font-size:1rem; font-weight:bold; cursor:pointer; margin-top:8px; }
  .btn-main { background:#1e3a8a; color:#fff; }
  .btn-green { background:#059669; color:#fff; }
  .btn-sub { background:#e2e8f0; color:#334155; }
  .btn-gray { background:#636e72; color:#fff; }
  .btn-sm { display:inline-block; width:auto; padding:8px 12px; font-size:.82rem; margin:0; }
  .btn-red { background:#fee2e2; color:#b91c1c; }
  .btn:hover { filter:brightness(1.07); }
  .btn-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap:8px; margin-top:12px; }
  .btn-row .btn { margin-top:0; }
  .msg { font-size:.85rem; margin-top:8px; padding:8px 10px; border-radius:6px; display:none; }
  .msg.ok { display:block; background:#dcfce7; color:#166534; }
  .msg.err { display:block; background:#fee2e2; color:#991b1b; }
  .msg.info { display:block; background:#e0f2fe; color:#075985; }

  /* ===== 工場カード ===== */
  .factory-card { background:#fff; padding:14px; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1); margin-bottom:12px; border-left:5px solid #2563eb; min-width:0; }
  .factory-card.full { border-left-color:#9ca3af; opacity:.85; }
  .factory-card.s-great { border-left-color:#16a34a; }
  .factory-card.s-good { border-left-color:#2563eb; }
  .factory-card.s-fair { border-left-color:#f59e0b; }
  .factory-name { font-size:1.05rem; font-weight:bold; color:#1e3a8a; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:.78rem; padding:3px 8px; border-radius:12px; background:#e0e7ff; color:#1e3a8a; white-space:nowrap; }
  .badge.great { background:#dcfce7; color:#166534; }
  .badge.fair { background:#fef3c7; color:#92400e; }
  .info-table { width:100%; border-collapse:collapse; margin-bottom:8px; }
  .info-table td { padding:3px 0; font-size:.88rem; vertical-align:top; }
  .info-table td.label { width:7.2em; color:#666; font-weight:bold; }
  .reasons { font-size:.82rem; margin:6px 0 8px; line-height:1.6; }
  .reasons .ok { color:#166534; }
  .reasons .warn { color:#b45309; }
  .reasons .ng { color:#b91c1c; }
  .bar { height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; margin:2px 0 6px; }
  .bar > div { height:100%; background:#2563eb; }

  .status-box { background:#f8fafc; border:1px solid #e2e8f0; padding:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:stretch; gap:4px; }
  .status-item { text-align:center; flex:1; }
  .status-item span { display:block; font-size:.72rem; color:#64748b; }
  .status-item strong { font-size:1.15rem; color:#334155; }
  .status-item strong.remaining { color:#dc2626; font-size:1.35rem; }
  .status-item strong.remaining.zero { color:#6b7280; }
  .stepper { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:2px; }
  .stepper button { width:36px; height:36px; border-radius:50%; border:1px solid #cbd5e1; background:#fff; font-size:1.1rem; cursor:pointer; line-height:1; }
  .card-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .edit-panel { display:none; background:#f8fafc; border:1px dashed #94a3b8; border-radius:6px; padding:10px; margin-top:8px; }
  .edit-panel.open { display:block; }
  .edit-panel .field { margin-bottom:8px; }
  .edit-panel input, .edit-panel select { padding:8px; font-size:.95rem; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check-line { display:flex; gap:12px; font-size:.9rem; flex-wrap:wrap; }
  .check-line label { display:flex; align-items:center; gap:4px; font-weight:normal; }
  .check-line input { width:auto; }

  .app-item { border-bottom:1px solid #e5e7eb; padding:10px 0; font-size:.88rem; }
  .app-item:last-child { border-bottom:none; }
  .app-item .nm { font-weight:bold; font-size:.98rem; }
  .app-item .sub { color:#64748b; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.75rem; background:#dcfce7; color:#166534; margin-left:6px; }
  .tag.none { background:#f1f5f9; color:#64748b; }
  details summary { cursor:pointer; font-weight:bold; font-size:.9rem; color:#1e3a8a; padding:4px 0; }
  pre.code { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:6px; font-size:.72rem; overflow-x:auto; white-space:pre; max-height:260px; }
  .small { font-size:.8rem; color:#64748b; line-height:1.6; }

  /* ===== 表示サイズ：PC表示／スマホ表示（自動判定。右上のボタンで手動切替も可） ===== */
  .tab-btn { display:flex; align-items:center; justify-content:center; gap:6px; }
  .badge.st-good { background:#ede9fe; color:#5b21b6; }
  .badge.st-closed { background:#e5e7eb; color:#4b5563; }
  html.v-pc { font-size:17px; }
  html.v-mobile { font-size:16px; }

  /* --- スマホ表示：1列・下にタブバー・大きな操作ボタン --- */
  html.v-mobile body { padding-bottom:calc(86px + env(safe-area-inset-bottom)); }
  html.v-mobile .container { max-width:560px; }
  html.v-mobile #tab-input.active, html.v-mobile #tab-list.active, html.v-mobile #tab-search.active, html.v-mobile #factory-admin { grid-template-columns:minmax(0,1fr); }
  html.v-mobile .tabs { position:fixed; left:0; right:0; bottom:0; top:auto; margin:0; padding:0 0 env(safe-area-inset-bottom); background:#fff; border-top:1px solid #cbd5e1; box-shadow:0 -2px 8px rgba(0,0,0,.12); gap:0; z-index:50; }
  html.v-mobile .tab-btn { background:#fff; color:#64748b; border-radius:0; padding:8px 2px 7px; font-size:.7rem; flex-direction:column; gap:2px; line-height:1.25; border-top:3px solid transparent; }
  html.v-mobile .tab-btn .ti { font-size:1.3rem; line-height:1; }
  html.v-mobile .tab-btn.active { background:#eef2ff; color:#1e3a8a; border-top-color:#1e3a8a; }
  html.v-mobile input[type=text], html.v-mobile input[type=tel], html.v-mobile input[type=number], html.v-mobile input[type=time], html.v-mobile select, html.v-mobile textarea { font-size:16px !important; }
  html.v-mobile .btn { padding:14px; }
  html.v-mobile .btn-sm { padding:10px 12px; }
  html.v-mobile .card-actions .btn-sm { flex:1 1 auto; text-align:center; }
  html.v-mobile .stepper button { width:40px; height:40px; }
  html.v-mobile .info-table td.label { width:7.2em; }
  html.v-mobile .status-item strong { font-size:1.05rem; }

  /* --- PC表示：横に広く・上にタブ・2〜3列 --- */
  html.v-pc .container { max-width:1400px; }
  html.v-pc .tab-btn { font-size:1rem; padding:14px 6px; }
  html.v-pc #tab-input.active { grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); }
  html.v-pc #tab-search.active { grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); }
  html.v-pc #tab-list.active { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  html.v-pc #factory-admin { grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); }
  html.v-pc .g { grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
  html.v-pc .g.w2 { grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); }
  html.v-pc #match-area, html.v-pc #search-results { position:sticky; top:70px; max-height:calc(100vh - 90px); overflow-y:auto; }
  html.v-pc .btn-row { grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }

  /* ===== 印刷（フォーム部分のみ） ===== */
  @media print {
    @page { size:A4; margin:.8cm; }
    body { background:#fff; padding:0; }
    .topbar, .tabs, #match-area, .btn-row, #msg-form, .no-print, .tab:not(#tab-input) { display:none !important; }
    #tab-input.active { display:block !important; }
    .box { box-shadow:none; padding:0; }
    .option-card:has(input:checked), .option-card.on { background:#fff; border:2px solid #000; }
    .section-title { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div id="boot-msg" style="padding:10px;font-size:14px;line-height:1.6;background:#fffbeb;border:1px solid #f59e0b;border-radius:6px;margin:6px 0;color:#92400e">
  読み込み中です… / Loading… / Carregando…<br>
  <span style="font-size:12px">このまま変わらない場合は、<b>Chrome または Safari</b> で開き直してください（LINE・メール・ドライブのプレビューでは動きません）。<br>If nothing changes, open this file in Chrome or Safari.</span>
  <div id="boot-err" style="margin-top:6px;font-size:12px;color:#b91c1c"></div>
</div>
<div id="warn-msg" style="display:none;padding:10px;font-size:13px;line-height:1.6;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;margin:6px 0;color:#991b1b"></div>
<div class="container">
  <div class="topbar">
    <h1 data-i18n="app.title"></h1>
    <select id="lang-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
    </select>
    <select id="view-select" aria-label="View">
      <option value="auto" data-i18n-txt="view.auto"></option>
      <option value="pc" data-i18n-txt="view.pc"></option>
      <option value="mobile" data-i18n-txt="view.mobile"></option>
    </select>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-input"><span class="ti">📝</span><span data-i18n="tab.input"></span></button>
    <button class="tab-btn" data-tab="tab-factory"><span class="ti">🏭</span><span data-i18n="tab.factory"></span></button>
    <button class="tab-btn" data-tab="tab-list"><span class="ti">📋</span><span data-i18n="tab.list"></span></button>
    <button class="tab-btn" data-tab="tab-search"><span class="ti">🔎</span><span data-i18n="tab.search"></span></button>
  </div>

  <!-- ===== 1. 面接フォーム + マッチング ===== -->
  <div id="tab-input" class="tab active">
    <div class="box">
      <form id="interview-form" onsubmit="return false" autocomplete="off">
        <div class="form-head">
          <div>
            <h2 data-i18n="form.title"></h2>
            <div class="jp-label" data-i18n="form.sub"></div>
          </div>
          <div class="head-date"><span data-i18n="f.date"></span>: <span id="currentDate"></span></div>
        </div>

        <!-- 個人情報 -->
        <div class="section-title"><span data-i18n="sec.personal"></span></div>
        <div class="g">
          <div class="field" style="grid-column:1/-1">
            <label class="t"><span data-i18n="f.name"></span><span class="req" data-i18n="req"></span></label>
            <input type="text" id="f-name" data-i18n-ph="ph.name" required>
          </div>
        </div>
        <div class="g">
          <div class="field">
            <label class="t" data-i18n="f.age"></label>
            <input type="number" id="f-age" inputmode="numeric" min="15" max="80" data-i18n-ph="ph.age">
          </div>
          <div class="field">
            <label class="t" data-i18n="f.gender"></label>
            <select id="f-gender">
              <option value="">--</option>
              <option value="M" data-i18n-txt="o.M"></option>
              <option value="F" data-i18n-txt="o.F"></option>
            </select>
          </div>
        </div>
        <div class="g w2">
          <div class="field">
            <label class="t" data-i18n="f.phone"></label>
            <input type="tel" id="f-phone" placeholder="000-0000-0000">
          </div>
          <div class="field">
            <label class="t" data-i18n="f.apps"></label>
            <div class="opts">
              <label class="option-card"><input type="checkbox" name="apps" value="WhatsApp"> WhatsApp</label>
              <label class="option-card"><input type="checkbox" name="apps" value="LINE"> LINE</label>
              <label class="option-card"><input type="checkbox" name="apps" value="Messenger"> Messenger</label>
              <label class="option-card"><input type="checkbox" name="apps" value="Outros"><span data-i18n="o.other"></span></label>
            </div>
          </div>
        </div>
        <div class="g">
          <div class="field" style="grid-column:1/-1">
            <label class="t" data-i18n="f.city"></label>
            <input type="text" id="f-city" data-i18n-ph="ph.city">
            <div class="hint" id="city-hint"></div>
          </div>
        </div>

        <!-- 能力とロジスティクス -->
        <div class="section-title"><span data-i18n="sec.skills"></span></div>
        <div class="g">
          <div class="field">
            <label class="t" data-i18n="f.nihongo"></label>
            <input type="number" id="f-nihongo" inputmode="numeric" min="0" max="100">
          </div>
        </div>
        <div class="field" style="margin-bottom:10px">
          <label class="t" data-i18n="f.cert"></label>
          <div class="opts">
            <label class="option-card"><input type="checkbox" name="cert" value="Empilhadeira"><span data-i18n="o.forklift"></span></label>
            <label class="option-card"><input type="checkbox" name="cert" value="Caminhão"><span data-i18n="o.truck"></span></label>
            <label class="option-card"><input type="checkbox" name="cert" value="Solda"><span data-i18n="o.weld"></span></label>
            <label class="option-card"><input type="checkbox" name="cert" value="Outros"><span data-i18n="o.other"></span>:</label>
            <input type="text" id="f-certother" data-i18n-ph="ph.certother">
          </div>
          <div class="sub-opt"><label class="option-card"><input type="checkbox" id="f-reach"><span data-i18n="q.reachsub"></span></label></div>
        </div>
        <div class="field" style="margin-bottom:10px">
          <label class="t" data-i18n="f.job"></label>
          <div class="opts">
            <label class="option-card"><input type="radio" name="job" value="Sim"><span data-i18n="o.yes"></span></label>
            <label class="option-card"><input type="radio" name="job" value="Não"><span data-i18n="o.no"></span></label>
            <label class="option-card"><input type="radio" name="job" value="Seguro"><span data-i18n="o.insurance"></span></label>
          </div>
        </div>
        <div class="g w2">
          <div class="field">
            <label class="t" data-i18n="f.car"></label>
            <div class="opts">
              <label class="option-card"><input type="radio" name="car" value="Sim"><span data-i18n="o.yes"></span></label>
              <label class="option-card"><input type="radio" name="car" value="Não"><span data-i18n="o.no"></span></label>
            </div>
          </div>
          <div class="field">
            <label class="t" data-i18n="f.apto"></label>
            <div class="opts">
              <label class="option-card"><input type="radio" name="apto" value="Sim"><span data-i18n="o.yes"></span></label>
              <label class="option-card"><input type="radio" name="apto" value="Não"><span data-i18n="o.no"></span></label>
            </div>
          </div>
        </div>
        <div class="g">
          <div class="field" style="grid-column:1/-1">
            <label class="t" data-i18n="f.filhos"></label>
            <input type="text" id="f-filhos" data-i18n-ph="ph.filhos">
          </div>
        </div>

        <!-- マッチング用の追加項目（任意） -->
        <div class="section-title"><span data-i18n="sec.extra"></span></div>
        <div class="g w2">
          <div class="field">
            <label class="t" data-i18n="f.shift"></label>
            <div class="opts">
              <label class="option-card"><input type="radio" name="shift" value="どちらでも" checked><span data-i18n="v.どちらでも"></span></label>
              <label class="option-card"><input type="radio" name="shift" value="昼勤のみ"><span data-i18n="v.昼勤のみ"></span></label>

let lang = (() => { try { const v = localStorage.getItem('lang'); if (LANGS.includes(v)) return v; } catch(e){}
  const n = (navigator.language || 'ja').slice(0,2); return LANGS.includes(n) ? n : 'ja'; })();

function t(k, p){
  const e = I18N[k];
  let s = e ? (e[LANGS.indexOf(lang)] || e[0]) : k;
  if (p) s = s.replace(/\{(\w+)\}/g, (m, x) => (p[x] !== undefined ? p[x] : m));
  return s;
}
const tv = v => I18N['v.'+v] ? t('v.'+v) : v;
const cityLabel = c => I18N['c.'+c] ? t('c.'+c) : c;
const resLabel = v => v === 'その他' ? t('v.res.その他') : cityLabel(v);

function applyStatic(){
  document.documentElement.lang = lang;
  document.title = t('app.title').replace(/^📋\s*/, '');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-txt]').forEach(el => { el.textContent = t(el.dataset.i18nTxt).replace(/<[^>]+>/g, ''); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh).replace(/<[^>]+>/g, ''); });
  $('lang-select').value = lang;
  const loc = lang === 'pt' ? 'pt-BR' : lang === 'en' ? 'en-US' : 'ja-JP';
  $('currentDate').textContent = new Date().toLocaleDateString(loc);
}

(function(){
  const dd = {}; DEFAULT_FACTORIES.forEach(f => dd[f.name] = f);
  let ch = false;
  factories.forEach(f => {
    if (!Array.isArray(f.wants)){ f.wants = (dd[f.name] && dd[f.name].wants) || []; ch = true; }
    if ('subCap' in f || 'subCur' in f){
      if (typeof f.femCap !== 'number'){ f.femCap = f.subCap || 0; f.femCur = f.subCur || 0; }
      delete f.subCap; delete f.subCur; ch = true;
    }
    ['maleCap','maleCur','femCap','femCur'].forEach(k => { if (typeof f[k] !== 'number'){ f[k] = 0; ch = true; } });
    if (typeof f.boost !== 'number'){ f.boost = (dd[f.name] && dd[f.name].boost) || 0; ch = true; }
    if (!f.status){ f.status = 'open'; ch = true; }
  });
  if (!LS.get('migr_v2', false)){
    factories.forEach(f => { if (/^中部抵抗器/.test(f.name) && !(f.wants || []).includes('weld')){ f.wants = [...(f.wants || []), 'weld']; } });
    LS.set('migr_v2', true); ch = true;
  }
  if (ch) LS.set('factories_'+FACTORY_VERSION, factories);
})();

let viewPref = LS.get('viewPref', 'auto');
function applyView(){
  const v = viewPref === 'auto' ? (window.innerWidth >= 900 ? 'pc' : 'mobile') : viewPref;
  const el = document.documentElement;
  el.classList.toggle('v-pc', v === 'pc'); el.classList.toggle('v-mobile', v === 'mobile');
  // スマホで「PC表示」を選んだときは、横幅1100pxの画面として表示する
  const meta = document.querySelector('meta[name=viewport]');
  const want = (viewPref === 'pc' && Math.min(screen.width, screen.height) < 700) ? 'width=1100' : 'width=device-width, initial-scale=1.0, viewport-fit=cover';
  if (meta && meta.content !== want) meta.content = want;
}
window.addEventListener('resize', () => { if (viewPref === 'auto') applyView(); });
window.addEventListener('orientationchange', () => { if (viewPref === 'auto') setTimeout(applyView, 200); });
$('view-select').addEventListener('change', e => { viewPref = e.target.value; LS.set('viewPref', viewPref); applyView(); });
$('view-select').value = viewPref;
applyView();

function readForm(){
  const cert = [...document.querySelectorAll('input[name=cert]:checked')].map(x => x.value);
  const car = radio('car'), apto = radio('apto'), cityText = $('f-city').value.trim();
  const quals = cert.map(c => CERT_KEY[c]).filter(Boolean);
  if (car === 'Sim') quals.push('car');                       // 車を持っている＝自動車免許ありとして扱う
  return {
    name: $('f-name').value.trim(), age: parseInt($('f-age').value, 10) || null,
    gender: ({M:'男性', F:'女性'})[$('f-gender').value] || '',
    phone: $('f-phone').value.trim(), apps: [...document.querySelectorAll('input[name=apps]:checked')].map(x => x.value),
    cityText, residence: resolveCity(cityText),
    nihongo: $('f-nihongo').value.trim(),
    cert, certOther: $('f-certother').value.trim(), reach: $('f-reach').checked && cert.includes('Empilhadeira'),
    quals, job: radio('job'), car, apto,
    housing: apto === 'Sim' ? '必要' : apto === 'Não' ? '不要' : 'どちらでも',
    filhos: $('f-filhos').value.trim(),
    shift: radio('shift') || 'どちらでも', wishLocation: $('f-wish').value || 'どこでも',
    interviewDate: $('f-idate').value.trim(), interviewTime: $('f-itime').value, wage: $('f-wage').value.trim(),
    vaga: $('f-vaga').value.trim(), interviewer: $('f-interviewer').value.trim(),
    obs: $('f-obs').value.trim()
  };
}

  const c = resolveCity(v);
  if (c){ h.textContent = t('city.ok', {c: cityLabel(c)}); h.className = 'hint ok'; }
  else { h.textContent = t('city.unknown'); h.className = 'hint warn'; }
}
function bindForm(){
  $('f-city').addEventListener('input', updateCityHint);
  // フォークリフトとリーチリフトの連動
  const fk = document.querySelector('input[name=cert][value=Empilhadeira]'), rc = $('f-reach');

}

/* =========================================================
   マッチングロジック（理由は [key, params] で保持し、表示時に翻訳）
   ========================================================= */
function km(a, b){
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distanceTo(f, residence){
  if (residence === 'その他') return 999;
  const from = CITY[residence];
  if (!from) return null;
  const ds = f.locations.map(l => CITY[l]).filter(Boolean).map(p => km(from, p));
  return ds.length ? Math.min(...ds) : null;
}
const qualList = a => {
  const l = (a.quals || []).map(k => t('q.'+k));
  if (a.reach) l.push(t('q.reach'));
  if (a.certOther) l.push(a.certOther);
  return l;
};
const cityDisp = a => a.residence ? resLabel(a.residence) : (a.cityText || '—');
const ageDisp = a => a.age ? t('match.age', {n:a.age}) : '—';
const maleRem = f => Math.max(0, (f.maleCap || 0) - (f.maleCur || 0));
const femRem  = f => Math.max(0, (f.femCap  || 0) - (f.femCur  || 0));
// 男性枠・女性枠は「その性別専用」。他の性別の人が使えるのは 総残り − 他性別の専用残り
function slotBlock(f, gender){
  const rem = Math.max(0, f.capacity - f.current);
  if (rem <= 0) return null;
  if (!['男性','女性','その他'].includes(gender)) return null;     // 性別未入力は判定しない
  const mR = gender !== '男性' ? maleRem(f) : 0, fR = gender !== '女性' ? femRem(f) : 0;
  if (rem - mR - fR > 0) return null;
  return mR > 0 && fR > 0 ? 'ng.reserved' : (fR > 0 ? 'ng.femaleonly' : 'ng.maleonly');
}
const slotExtra = f => {
  const parts = [];
  if (f.maleCap > 0) parts.push(`<div class="status-item"><span>🚹 ${t('slot.male')}</span><strong>${maleRem(f)}/${f.maleCap}</strong></div>`);
  if (f.femCap  > 0) parts.push(`<div class="status-item"><span>🚺 ${t('slot.female')}</span><strong>${femRem(f)}/${f.femCap}</strong></div>`);
  return parts.length ? `<div class="status-box" style="margin-top:6px">${parts.join('')}</div>` : '';
};
const remainingOf = f => Math.max(0, f.capacity - f.current);
// 「随時（良い人がいれば）」の工場は、人数が埋まっていても良い人なら紹介・決定できる
const canPlace = f => (f.status || 'open') !== 'closed' && (remainingOf(f) > 0 || f.status === 'good');
const statusBadge = f => (f.status === 'good') ? `<span class="badge st-good">${esc(t('st.good'))}</span>` : (f.status === 'closed') ? `<span class="badge st-closed">${esc(t('st.closed'))}</span>` : '';
const ageRangeText = f => t('age.range', { a: f.ageMin || '', b: f.ageMax || '' });

function evaluate(f, a){
  const ok = [], warn = [], ng = [];
  let s = 40;
  const rem = remainingOf(f);

  const st = f.status || 'open';
  if (st === 'closed') ng.push(['ng.closed']);
  else if (rem <= 0 && st !== 'good') ng.push(['ng.full']);
  else if (rem > 0){ s += Math.min(rem, 5) * 2; ok.push(['r.slots', {n:rem}]); }

  if (rem > 0){
    const blk = slotBlock(f, a.gender);
    if (blk) ng.push([blk]);
    else if (a.gender === '男性' && maleRem(f) > 0){ s += 8; ok.push(['r.maleslot', {n:maleRem(f)}]); }
    else if (a.gender === '女性' && femRem(f) > 0){ s += 8; ok.push(['r.femaleslot', {n:femRem(f)}]); }
  }

  if (a.age && f.ageMin && a.age < f.ageMin) ng.push(['ng.agemin', {n:f.ageMin}]);
  else if (a.age && f.ageMax && a.age > f.ageMax) ng.push(['ng.agemax', {n:f.ageMax}]);
  else if (f.ageMin || f.ageMax){ if (a.age){ s += 8; ok.push(['r.ageok', {r:ageRangeText(f)}]); } }
  else s += 4;

  if (f.gender === '男性推奨'){
    if (a.gender === '男性'){ s += 10; ok.push(['r.male']); } else if (a.gender){ s -= 18; warn.push(['w.maleWork']); }
  } else if (f.gender === '女性推奨'){
    if (a.gender === '女性'){ s += 10; ok.push(['r.female']); } else if (a.gender){ s -= 18; warn.push(['w.femaleWork']); }
  } else s += 4;

  const hasDay = f.shifts.includes('昼勤'), hasNight = f.shifts.includes('夜勤');
  if (a.shift === '昼勤のみ'){ if (hasDay){ s += 14; ok.push(['r.day']); } else ng.push(['ng.noday']); }
  else if (a.shift === '夜勤のみ'){ if (hasNight){ s += 14; ok.push(['r.night']); } else ng.push(['ng.nonight']); }
  else { s += hasDay && hasNight ? 8 : 4; ok.push(['r.shifts', {s: f.shifts.map(tv).join(' / ')}]); }

  const d = distanceTo(f, a.residence);
  const hasHouse = f.housing === 'あり';
  const dk = d === null ? 0 : Math.round(d);
  if (d === null) warn.push(['w.dist']);
  else if (d <= 6){ s += 25; ok.push(['r.near', {n:dk}]); }
  else if (d <= 15){ s += 18; ok.push(['r.zone', {n:dk}]); }
  else if (d <= 25){ s += 8; ok.push(['r.car', {n:dk}]); }
  else if (d <= 40){ s -= 2; warn.push(['w.far', {n:dk}]); }
  else {
    if (hasHouse){ s += 6; warn.push(['w.farhouse']); } else ng.push(['ng.far']);
  }
  // 車がない人は、遠い工場（社宅なし）を減点
  if (a.car === 'Não' && d !== null && d > 15 && d <= 40 && !hasHouse){ s -= 15; warn.push(['w.nocar', {n:dk}]); }

  if (a.housing === '必要'){
    if (hasHouse){ s += 12; ok.push(['r.house']); }
    else if (f.housing === '記載なし'){ s -= 5; warn.push(['w.houseq']); }
    else ng.push(['ng.nohouse']);
  } else if (a.housing === 'どちらでも' && hasHouse){ s += 2; }

  if (a.wishLocation && a.wishLocation !== 'どこでも'){
    if (f.locations.includes(a.wishLocation)){ s += 18; ok.push(['r.wish']); } else s -= 6;
  }

  // 募集中の資格・経験を持っていれば大きく加点
  const BONUS = { car:8, forklift:15, truck:30, weld:25 };
  const has = k => (a.quals || []).includes(k);
  (f.wants || []).forEach(w => {
    if (w === 'reach'){
      if (a.reach){ s += 30; ok.unshift(['r.want', {q:t('q.reach')}]); }
      else if (has('forklift')){ s += 8; warn.unshift(['r.reachq']); }
    } else if (has(w)){ s += BONUS[w] || 10; ok.unshift(['r.want', {q:t('q.'+w)}]); }
  });
  if (f.boost){ s += f.boost; ok.unshift(['r.boost']); }
  // 随時（良い人がいれば）：募集資格に合う人か、総合点が高い人だけを紹介対象にする
  if (st === 'good'){
    const fit = (f.wants || []).some(w => w === 'reach' ? a.reach : has(w));
    if (fit || Math.round(s) >= 80){
      if (!fit) s -= 10;                       // 資格が合わない場合は、積極募集中の工場より下に並べる
      ok.unshift(['r.goodfit']); if (rem <= 0) warn.push(['w.goodfull']);
    } else ng.push(['ng.goodonly']);
  }

  const raw = Math.round(s);
  s = Math.max(0, Math.min(100, raw));
  return { f, score:s, raw, ok, warn, ng, rem, dist:d };
}
function matchAll(a){
  const all = factories.map(f => evaluate(f, a));
  return {
    good: all.filter(r => !r.ng.length).sort((x,y) => y.raw - x.raw),
    out:  all.filter(r =>  r.ng.length).sort((x,y) => y.raw - x.raw)
  };
}
const R = r => t(r[0], r[1]);

function adminSlotRow(icon, label, hint, pre, cap, cur){
  const rem = Math.max(0, cap - cur);
  return `<div class="small" style="margin:10px 0 2px"><b>${icon} ${label}</b>（${hint}）</div>
  <div class="status-box">
    <div class="status-item"><span>${t('s.cap')}</span><div class="stepper"><button data-act="${pre}cap-">−</button><strong>${cap}</strong><button data-act="${pre}cap+">＋</button></div></div>
    <div class="status-item"><span>${t('s.cur')}</span><div class="stepper"><button data-act="${pre}cur-">−</button><strong>${cur}</strong><button data-act="${pre}cur+">＋</button></div></div>
    <div class="status-item"><span>${t('s.rem')}</span><strong class="remaining ${rem===0?'zero':''}">${rem}</strong></div>
  </div>`;
}

   マッチ結果の表示

function gradeOf(sc){ return sc >= 75 ? ['great', t('grade.great')] : sc >= 55 ? ['good', t('grade.good')] : ['fair', t('grade.fair')]; }

function factoryInfoTable(f){
  const age = (f.ageMin||f.ageMax) ? ageRangeText(f) : tv('不問');
  return `<table class="info-table">
    <tr><td class="label">${t('i.loc')}</td><td>${esc(f.locations.map(cityLabel).join(' / '))}</td></tr>

    ${(f.wants && f.wants.length) ? `<tr><td class="label">${t('i.want')}</td><td>⭐ ${esc(f.wants.map(k => t('q.'+k)).join(' / '))}</td></tr>` : ''}
    ${(f.status && f.status !== 'open') ? `<tr><td class="label">${t('fac.status')}</td><td>${esc(t('st.' + f.status))}</td></tr>` : ''}

function statusBox(f){
  const rem = remainingOf(f);
  return `<div class="status-box">
    <div class="status-item"><span>${t('s.cap')}</span><strong>${t('n.people',{n:f.capacity})}</strong></div>
    <div class="status-item"><span>${t('s.cur')}</span><strong>${t('n.people',{n:f.current})}</strong></div>
    <div class="status-item"><span>${t('s.rem')}</span><strong class="remaining ${rem===0?'zero':''}">${t('n.people',{n:rem})}</strong></div>
  </div>`;
}
const curApplicant = () => applicants.find(x => x.id === curId);

function renderMatch(a){
  const { good, out } = matchAll(a);
  const assigned = curApplicant() ? curApplicant().assigned : '';
  let html = `<div class="box"><h2>${esc(t('match.title', {name: a.name || t('match.thisperson'), n: good.length}))}</h2>
    <div class="small">${esc(t('match.sum', {res: cityDisp(a), age: ageDisp(a), gender: a.gender ? tv(a.gender) : '—', shift: tv(a.shift), housing: tv(a.housing)}))}</div>
    ${qualList(a).length ? `<div class="small">${esc(t('match.quals',{q: qualList(a).join(' / ')}))}</div>` : ''}</div>`;

  if (!good.length) html += `<div class="box">${esc(t('match.none'))}</div>`;

  good.forEach((r, i) => {
    const [cls, label] = gradeOf(r.score);
    const isMine = assigned === r.f.name;
    html += `<div class="factory-card s-${cls}">
      <div class="factory-name"><span>${i+1}. 🏢 ${esc(r.f.name)} ${statusBadge(r.f)}</span><span class="badge ${cls}">${esc(label)} ${esc(t('pts',{n:r.score}))}</span></div>
      <div class="bar"><div style="width:${r.score}%"></div></div>
      ${factoryInfoTable(r.f)}
      <div class="reasons">
        ${r.ok.map(x => `<div class="ok">✔ ${esc(R(x))}</div>`).join('')}
        ${r.warn.map(x => `<div class="warn">⚠ ${esc(R(x))}</div>`).join('')}
      </div>
      ${statusBox(r.f)}${slotExtra(r.f)}
      <div class="card-actions">
        ${isMine
          ? `<button class="btn btn-sub btn-sm" disabled>${t('btn.decided')}</button>`
          : `<button class="btn btn-green btn-sm" data-decide="${r.f.id}">${t('btn.decide')}</button>`}
      </div>
    </div>`;
  });

  if (out.length){
    html += `<div class="box"><details><summary>${esc(t('excluded',{n:out.length}))}</summary>` +
      out.map(r => `<div class="app-item"><div class="nm">${esc(r.f.name)}</div>
        <div class="reasons">${r.ng.map(x => `<div class="ng">✖ ${esc(R(x))}</div>`).join('')}</div></div>`).join('') +
      `</details></div>`;
  }
  $('match-area').innerHTML = html;
  $('match-area').dataset.shown = '1';
  $('match-area').querySelectorAll('[data-decide]').forEach(b => b.addEventListener('click', () => decide(b.dataset.decide)));
}

/* =========================================================
   応募者の登録・決定
   ========================================================= */
function topNames(a){ return matchAll(a).good.slice(0,3).map(r => r.f.name).join(' / '); }
function upsertApplicant(a, assignedName, extra){
  const now = new Date().toLocaleString('ja-JP');
  let rec = curApplicant();
  // 名前が変わったら別の人として保存する（前の人の記録を上書きしない）
  if (rec && rec.name && a.name && rec.name !== a.name){ rec = null; curId = null; }
  if (!rec){
    curId = 'A' + Date.now();
    rec = { id:curId, createdAt:now, assigned:'' };
    applicants.unshift(rec);
  }
  Object.assign(rec, a, { top: topNames(a) });
  if (assignedName !== undefined) rec.assigned = assignedName;
  if (extra) Object.assign(rec, extra);
  saveApplicants();
  return rec;
}

  telefone: a.phone || '', apps: (a.apps || []).join(', '), cidade: a.cityText || '',

  data_entrevista: a.interviewDate || '', hora_entrevista: a.interviewTime || '',
  salario: a.wage || '', vaga: a.vaga || '', entrevistador: a.interviewer || '', obs: a.obs || ''
});
const payloadKey = a => JSON.stringify(formPayload(a));
// 方式②：JSON（行の更新あり）。列名・値は日本語
const CERT_JA = { 'Empilhadeira':'フォークリフト', 'Caminhão':'中型トラック', 'Solda':'溶接', 'Outros':'その他' };
const COLS = [

  ['appsText','連絡アプリ'],['cityText','在住地'],['nihongo','日本語%'],['qualsText','保有資格'],['reachText','リーチリフト経験'],

  ['interviewDate','面接日'],['interviewTime','面接時間'],['wage','時給'],['vaga','募集職種'],['interviewer','担当者'],
  ['shift','希望勤務体制'],['wishLocation','希望勤務地'],['obs','備考'],['assigned','決定先'],['top','おすすめ上位']
];
const exportRec = a => ({ ...a,
  appsText: (a.apps || []).join('・'),

async function sendToSheet(rec, force){
  if (!sheetUrl) return 'none';
  if (sheetMode === 'form' && rec.sentForm && !force) return 'skipped';
  try {
    if (sheetMode === 'form'){
      await fetch(sheetUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(formPayload(rec)).toString() });
      rec.sentForm = Date.now(); rec.sentKey = payloadKey(rec); saveApplicants();
    } else {
      await fetch(sheetUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(exportRec(rec)) });
    }
    return 'sent';
  } catch(e){ return 'error'; }
}
const sendResultText = (r, rec) => t(({sent:'m.sent', none:'m.none', skipped:'m.skipped'})[r] || 'm.error', {name: rec.name});

$('btn-register').addEventListener('click', async () => {

  const rec = upsertApplicant(a);
  let force = false;
  if (sheetMode === 'form' && rec.sentForm){
    force = confirm(t('m.resend'));
    if (!force){ showMsg('msg-form','info', t('m.skipped',{name:rec.name})); renderApplicants(); return; }
  }
  const r = await sendToSheet(rec, force);
  showMsg('msg-form', r === 'error' ? 'err' : 'ok', sendResultText(r, rec));
  renderApplicants();
});

/* ---------- 印刷・PDF：押すと必ず先に保存（端末＋スプレッドシート）してから印刷画面を開く ---------- */
let printBusy = false;
const printTitleFor = a => ['面接フォーム', a.name, new Date().toISOString().slice(0, 10)].filter(Boolean).join('_');
function openPrint(){
  printBusy = true;
  window.print();
  setTimeout(() => { printBusy = false; }, 1500);
}
async function saveThenPrint(isPdf){
  const a = readForm();
  if (!a.name){      // 氏名がないと保存できない。空白のまま印刷する場合だけ確認
    if (confirm(t('print.blank'))) openPrint(); else showMsg('msg-form','err', t('m.miss',{x: validate(a).join(', ')}));
    return;
  }
  printBusy = true;
  const rec = upsertApplicant(a);                                   // 端末に必ず保存
  let force = false;
  if (sheetMode === 'form' && rec.sentForm && rec.sentKey !== payloadKey(rec)) force = confirm(t('print.changed'));
  const r = await Promise.race([ sendToSheet(rec, force), new Promise(res => setTimeout(() => res('timeout'), 5000)) ]);
  renderApplicants();
  let msg = r === 'timeout' ? t('print.timeout', {name: rec.name}) : sendResultText(r, rec);
  if (isPdf) msg += ' ' + t('print.pdfhint');
  showMsg('msg-form', r === 'error' ? 'err' : 'ok', msg);
  openPrint();
}

  if (!printBusy && a.name){ const rec = upsertApplicant(a); renderApplicants(); sendToSheet(rec); }
  document.title = printTitleFor(a);

async function decide(fid){
  const a = readForm(), miss = validate(a);
  if (miss.length){ showMsg('msg-form','err', t('m.needdecide',{x: miss.join(', ')})); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const f = factories.find(x => x.id === fid);
  if (!f || !canPlace(f)){ showMsg('msg-form','err', t(f && f.status === 'closed' ? 'ng.closed' : 'm.full')); return; }
  const blk = slotBlock(f, a.gender);
  if (blk){ showMsg('msg-form','err', t(blk)); return; }
  const prev = curApplicant();
  if (prev && prev.name === a.name) releaseSlot(prev);
  f.current++;
  const usedMale = a.gender === '男性' && f.maleCap > 0 && maleRem(f) > 0;
  const usedFem  = a.gender === '女性' && f.femCap > 0 && femRem(f) > 0;
  if (usedMale) f.maleCur++;
  if (usedFem) f.femCur++;
  saveFactories();
  const rec = upsertApplicant(a, f.name, { usedMale, usedFem });
  const r = await sendToSheet(rec);
  showMsg('msg-form', r === 'error' ? 'err' : 'ok', t('m.decided',{f:f.name, c:f.current, cap:f.capacity}) + sendResultText(r, rec));
  renderMatch(a);
  renderApplicants();
  window.scrollTo({top:0, behavior:'smooth'});
}

      else if (act === 'cur+') f.current++;

/* =========================================================
   スプレッドシート連携設定
   ========================================================= */
function buildGas(){
  const m = /\/d\/([A-Za-z0-9_-]+)/.exec(sheetPage || ''), id = m ? m[1] : '';
  return [
"// New script (method 2): saves one row per applicant ID into the tab below. (Add the history reader code too, to read it back in Search.)",
"// SHEET_ID: leave empty if you created this script from the spreadsheet (Extensions > Apps Script)",
"const SHEET_ID = '" + id + "';",
"const TAB = '応募者';",
"const KEYS = " + JSON.stringify(COLS.map(c => c[0])) + ";",
"const HEAD = " + JSON.stringify(COLS.map(c => c[1])) + ";",
"const TEXT_KEYS = ['phone', 'interviewDate', 'interviewTime', 'filhos'];",
"",
"function sheet_() {",
"  const ss = SHEET_ID ? SpreadsheetApp.openById(SHEET_ID) : SpreadsheetApp.getActiveSpreadsheet();",
"  return ss.getSheetByName(TAB) || ss.insertSheet(TAB);",
"}",
"",
"function doPost(e) {",
"  const d = JSON.parse(e.postData.contents);",
"  const sh = sheet_();",
"  if (sh.getLastRow() === 0) sh.appendRow(HEAD);",
"  const row = KEYS.map(k => {",
"    const v = (d[k] === undefined || d[k] === null) ? '' : d[k];",
"    return (TEXT_KEYS.indexOf(k) >= 0 && v !== '') ? \"'\" + v : v;",
"  });",
"  const ids = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().flat();",
"  const i = ids.indexOf(d.id);",
"  if (i > 0) sh.getRange(i + 1, 1, 1, row.length).setValues([row]);",
"  else sh.appendRow(row);",
"  return ContentService.createTextOutput('ok');",
"}"
  ].join('\n');
}
function buildHist(){
  const m = /\/d\/([A-Za-z0-9_-]+)/.exec(sheetPage || ''), id = m ? m[1] : '';
  const key = String(sheetKey || '').replace(/['"\\\r\n]/g, '');
  return [
"// History reader: lets the app read past applicants from this spreadsheet.",
"// Add it to the SAME Apps Script project as the web-app URL (keep your existing code).",
"// HIST_SHEET_ID: leave empty if the script was created from the spreadsheet (Extensions > Apps Script)",
"const HIST_SHEET_ID = '" + id + "';",
"// HIST_KEY: optional password. If you set one, enter the same one in the app (tab 3).",
"const HIST_KEY = '" + key + "';",
"const HIST_HINTS = ['nome', '氏名', '名前', 'idade', '年齢', 'telefone', '電話', 'cidade', 'お住まい', '在住地', 'genero', '性別'];",
"",
"function histNorm_(s) { return String(s || '').toLowerCase().replace(/[\\s_\\-]/g, ''); }",
"function histOut_(o) {",
"  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);",
"}",
"",
"function doGet(e) {",
"  const p = (e && e.parameter) || {};",
"  if (HIST_KEY && p.key !== HIST_KEY) return histOut_({ error: 'unauthorized' });",
"  const ss = HIST_SHEET_ID ? SpreadsheetApp.openById(HIST_SHEET_ID) : SpreadsheetApp.getActiveSpreadsheet();",
"  const tz = ss.getSpreadsheetTimeZone();",
"  const sheets = ss.getSheets();",
"  let sh = p.tab ? ss.getSheetByName(p.tab) : null;",
"  if (!sh) {   // pick the tab whose header row looks most like the applicant form",
"    let best = -1;",
"    sheets.forEach(s => {",
"      if (s.getLastRow() < 1 || s.getLastColumn() < 1) return;",
"      const head = s.getRange(1, 1, 1, s.getLastColumn()).getValues()[0].map(histNorm_);",
"      const score = HIST_HINTS.filter(h => head.some(c => c.indexOf(histNorm_(h)) >= 0)).length;",
"      if (score > best) { best = score; sh = s; }",
"    });",
"  }",
"  if (!sh) sh = sheets[0];",
"  const R = sh.getLastRow(), C = sh.getLastColumn();",
"  const vals = (R > 0 && C > 0) ? sh.getRange(1, 1, R, C).getValues() : [];",
"  const conv = v => (v instanceof Date) ? Utilities.formatDate(v, tz, v.getFullYear() < 1950 ? 'HH:mm' : 'yyyy/MM/dd HH:mm') : v;",
"  const rows = vals.map(r => r.map(conv));",
"  return histOut_({ tab: sh.getName(), headers: rows[0] || [], rows: rows.slice(1), tabs: sheets.map(s => s.getName()) });",
"}"
  ].join('\n');
}

/* ---------- スプレッドシートの履歴を読み込む ----------
   列名が日本語・ポルトガル語のどちらでも、列の並びが違っても読めるようにしています。
   見出しが読み取れないときは、添付フォームの項目順（［日時］氏名・年齢・性別…）として読みます。 */
const hnorm = s => String(nz(s)).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[\s_\-・:：()（）\/／%％?？!！.。,、]/g, '');
const HSYN = {
  id:['id'], createdAt:['登録日時','timestamp','carimbodedatahora','datahora','日時','登録日','dataenvio'],
  name:['nome','nomecompleto','氏名','名前','name','fullname'],
  age:['idade','年齢','age'], gender:['genero','性別','gender','sexo'], phone:['telefone','電話','電話番号','phone','tel','celular'],
  apps:['apps','aplicativos','aplicativosdecontato','連絡アプリ','連絡用アプリ','連絡'],
  city:['cidade','お住まい','住所','在住地','住まい','city'],
  nihongo:['nihongo','日本語','日本語力','日本語能力'],
  cert:['cert','certificacao','資格','保有資格'], certOther:['certoutros','certificacaooutros','その他資格','資格その他'],
  reach:['リーチリフト経験','reach'],
  job:['job','trabalhandoatualmente','trabalhando','現在の仕事','仕事'],
  car:['car','carro','possuicarro','車'], apto:['apto','precisadeapto','寮','寮希望','社宅'],
  filhos:['filhos','子供','お子さん'],
  idate:['dataentrevista','面接日'], itime:['horarioentrevista','horaentrevista','horario','面接時間','時間'],
  wage:['salario','時給'], vaga:['vaga','vagaoferecida','募集職種','紹介職種'],
  interviewer:['entrevistador','担当者','担当者名','担当'], obs:['obs','observacoes','comentarios','備考','メモ','備考メモ'],
  shift:['希望勤務体制'], wish:['希望勤務地'], assigned:['決定先'], top:['おすすめ上位']
};
const HSYN_N = {}; Object.keys(HSYN).forEach(f => { HSYN_N[f] = HSYN[f].map(hnorm); });
const FORM_ORDER = ['name','age','gender','phone','apps','city','nihongo','cert','certOther','job','car','apto','filhos','idate','itime','wage','vaga','interviewer','obs'];

function mapHeaders(headers){
  const map = {};
  headers.forEach((h, i) => {
    const n = hnorm(h); if (!n) return;
    let best = null, score = 0;
    Object.keys(HSYN_N).forEach(f => HSYN_N[f].forEach(sy => {
      if (n === sy){ if (sy.length + 100 > score){ best = f; score = sy.length + 100; } }
      else if (sy.length >= 3 && n.indexOf(sy) >= 0 && sy.length > score){ best = f; score = sy.length; }
    }));
    if (best && map[best] === undefined) map[best] = i;
  });
  return map;
}
const yesno = v => {
  const n = hnorm(v); if (!n) return '';
  if (/^(sim|はい|yes|y|あり|有|ある)/.test(n) || n === 's') return 'Sim';
  if (/^(nao|いいえ|no|なし|無|ない)/.test(n) || n === 'n') return 'Não';
  return '';
};
const histJob = v => /seguro|失業|desemprego|unemploy/.test(hnorm(v)) ? 'Seguro' : yesno(v);
const histGender = v => { const n = hnorm(v); if (/^(f|fem|女|female)/.test(n)) return '女性'; if (/^(m|masc|男|male)/.test(n)) return '男性'; return ''; };
function histCert(v){
  const out = { cert:[], reach:false };
  String(nz(v)).split(/[,、・;；\/／]+/).forEach(tok => {
    const n = hnorm(tok); if (!n) return;
    if (/reach|リーチ/.test(n)){ out.reach = true; if (out.cert.indexOf('Empilhadeira') < 0) out.cert.push('Empilhadeira'); return; }
    let key = '';
    if (/empilh|フォーク|forklift/.test(n)) key = 'Empilhadeira';
    else if (/camin|トラック|truck/.test(n)) key = 'Caminhão';
    else if (/solda|溶接|weld/.test(n)) key = 'Solda';
    else if (/outros|その他|other/.test(n)) key = 'Outros';
    if (key && out.cert.indexOf(key) < 0) out.cert.push(key);
  });
  return out;
}
function fromHistory(headers, rows, tabName){
  let map = mapHeaders(headers || []), data = rows || [], pos = false;
  if (Object.keys(map).length < 3){          // 見出しが読み取れない → フォームの項目順として読む
    pos = true; data = [headers || []].concat(rows || []);
    const first = String((data[0] || [])[0] || '');
    const off = /(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})|(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})|\d{1,2}:\d{2}/.test(first) ? 1 : 0;
    map = {}; FORM_ORDER.forEach((f, i) => { map[f] = i + off; });
  }
  const out = [];
  data.forEach((r, idx) => {
    const get = f => map[f] === undefined ? '' : nz(r[map[f]]);
    const S = f => String(get(f)).trim();
    const name = S('name');
    if (!name || HSYN_N.name.indexOf(hnorm(name)) >= 0) return;          // 空行・見出し行
    if (name === 'テスト太郎' || /^TEST/.test(S('id'))) return;           // テスト送信の行
    const c = histCert(get('cert'));
    let phone = S('phone').replace(/^'/, ''); if (/^\d{10}$/.test(phone) && /^[789]/.test(phone)) phone = '0' + phone;
    const sheetRow = idx + (pos ? 1 : 2);
    out.push(deriveFields({
      id: S('id') || ('H:' + (tabName || '') + ':' + sheetRow), createdAt:S('createdAt'), name,
      age:parseInt(get('age'), 10) || null, gender:histGender(get('gender')), phone,
      apps:S('apps').split(/[,、・;；\/／]+/).map(x => x.trim()).filter(Boolean),
      cityText:S('city'), residence:'', nihongo:S('nihongo').replace(/[^\d.]/g, ''),
      cert:c.cert, certOther:S('certOther'), reach:c.reach || /あり|sim/.test(hnorm(get('reach'))),
      job:histJob(get('job')), car:yesno(get('car')), apto:yesno(get('apto')), filhos:S('filhos'),
      interviewDate:S('idate'), interviewTime:S('itime'), wage:S('wage'), vaga:S('vaga'), interviewer:S('interviewer'),
      shift:S('shift') || 'どちらでも', wishLocation:S('wish') || 'どこでも', obs:S('obs'), assigned:S('assigned'), top:S('top')
    }));
  });
  return out;
}
function personKey(a){
  const ph = String(nz(a.phone)).replace(/\D/g, ''), nm = String(nz(a.name)).replace(/\s/g, '').toLowerCase();
  return ph ? nm + '|' + ph : nm + '|' + nz(a.age);
}
function dedupeRemote(list){                          // 同じ人が何行もあるときは、いちばん新しい行を使う
  const m = {}, order = [];
  list.forEach(r => { const k = personKey(r); if (!(k in m)) order.push(k); m[k] = r; });
  return order.map(k => m[k]);
}
function candidatePool(){
  const local = applicants.map(a => deriveFields({...a, _src:'local'}));
  const ids = new Set(applicants.map(a => a.id)), keys = new Set(local.map(personKey));
  const remote = remoteRows.filter(r => !ids.has(r.id) && !keys.has(personKey(r))).map(r => ({...r, _src:'sheet'}));
  return local.concat(remote);
}
function updateSearchSource(){
  const b = candidatePool().filter(c => c._src === 'sheet').length;
  $('search-source').textContent = t('search.source', {a: applicants.length, b});
}
async function loadRemote(manual){
  if (!sheetUrl){ if (manual) showMsg('msg-search','err', t('sheet.needurl')); return false; }
  try {
    const url = sheetUrl + (sheetUrl.indexOf('?') >= 0 ? '&' : '?') + 'action=history' + (sheetKey ? '&key=' + encodeURIComponent(sheetKey) : '');
    const res = await fetch(url);
    const txt = await res.text();
    let j = null; try { j = JSON.parse(txt); } catch(e){}
    if (!j){ if (manual) showMsg('msg-search','err', t('search.loadfail')); return false; }
    if (j.error){ if (manual) showMsg('msg-search','err', t(j.error === 'unauthorized' ? 'search.unauth' : 'search.loadfail')); return false; }
    remoteRows = dedupeRemote(fromHistory(j.headers, j.rows, j.tab));
    remoteLoaded = true; updateSearchSource();
    if (manual) showMsg('msg-search','ok', t('search.loaded',{n:remoteRows.length, tab:j.tab || ''}));
    return true;
  } catch(e){ if (manual) showMsg('msg-search','err', t('search.loadfail')); return false; }
}
function fillSearchFactories(){
  const sel = $('s-factory'), cur = sel.value;
  sel.innerHTML = `<option value="">${esc(t('search.free'))}</option>` +
    factories.map(f => `<option value="${f.id}">${esc(f.name)}（${esc(t('s.rem'))} ${remainingOf(f)}${f.status === 'good' ? '・' + esc(t('st.good')) : f.status === 'closed' ? '・' + esc(t('st.closed')) : ''}）</option>`).join('');
  sel.value = factories.some(f => f.id === cur) ? cur : '';
}
function applyFactoryToSearch(){
  const f = factories.find(x => x.id === $('s-factory').value); if (!f) return;
  $('s-need').value = (f.status === 'good') ? '' : (remainingOf(f) || '');
  $('s-gender').value = f.gender === '男性推奨' ? '男性' : f.gender === '女性推奨' ? '女性' : '';
  $('s-agemin').value = f.ageMin || ''; $('s-agemax').value = f.ageMax || '';
  document.querySelectorAll('input[name=sprefer]').forEach(x => { x.checked = (f.wants || []).includes(x.value); });
  document.querySelectorAll('input[name=smust]').forEach(x => { x.checked = false; });
  $('s-shift').value = f.shifts.length === 1 ? f.shifts[0] : '';
  $('s-loc').value = f.locations[0] ? cityLabel(f.locations[0]) : '';
  $('s-house').value = f.housing === '記載なし' ? '' : f.housing;
  syncCards();
}
function readCriteria(){
  const num = id => { const n = parseInt($(id).value, 10); return isNaN(n) ? null : n; };
  const locText = $('s-loc').value.trim();
  return {
    factoryId: $('s-factory').value, need: num('s-need'), gender: $('s-gender').value,
    ageMin: num('s-agemin'), ageMax: num('s-agemax'),
    must: [...document.querySelectorAll('input[name=smust]:checked')].map(x => x.value),
    prefer: [...document.querySelectorAll('input[name=sprefer]:checked')].map(x => x.value),
    shift: $('s-shift').value, locText, loc: resolveCity(locText), km: num('s-km') || 20, house: $('s-house').value,
    carReq: $('s-car').checked, minjp: num('s-minjp'), idle: $('s-idle').checked, excl: $('s-excl').checked
  };
}
const hasQual = (c, k) => k === 'reach' ? !!c.reach : (c.quals || []).includes(k);

function evalCandidate(c, cr){
  const ok = [], warn = [], ng = [];
  let s = 50;
  if (cr.excl && c.assigned) ng.push(['x.placed', {f:c.assigned}]);

  if (cr.gender){
    if (c.gender && c.gender !== cr.gender) ng.push(['x.gender', {g:tv(cr.gender)}]);
    else if (!c.gender) warn.push(['s.genunk']);
  }
  if (cr.ageMin || cr.ageMax){
    if (!c.age) warn.push(['s.ageunk']);
    else if ((cr.ageMin && c.age < cr.ageMin) || (cr.ageMax && c.age > cr.ageMax)) ng.push(['x.age', {a:c.age}]);
    else s += 3;
  }
  const miss = cr.must.filter(k => !hasQual(c, k));
  if (miss.length) ng.push(['x.must', {q: miss.map(k => t('q.'+k)).join(' / ')}]);
  else if (cr.must.length){ s += 5; ok.push(['s.must', {q: cr.must.map(k => t('q.'+k)).join(' / ')}]); }
  const got = cr.prefer.filter(k => hasQual(c, k) && !cr.must.includes(k));
  got.forEach(k => { s += (k === 'reach' ? 15 : 12); });
  if (got.length) ok.unshift(['s.pref', {q: got.map(k => t('q.'+k)).join(' / ')}]);

  if (cr.shift){
    const want = cr.shift === '昼勤' ? '昼勤のみ' : '夜勤のみ';
    if (c.shift === 'どちらでも' || c.shift === want) s += 3; else ng.push(['x.shift', {s: tv(c.shift)}]);
  }
  if (cr.loc){
    const d = c.residence === 'その他' ? 999 : (CITY[c.residence] ? km(CITY[c.residence], CITY[cr.loc]) : null);
    if (d === null) warn.push(['s.distunk']);
    else if (d <= cr.km){ s += d <= 6 ? 20 : d <= 15 ? 12 : 5; ok.push(['s.near', {n:Math.round(d)}]); }
    else if (cr.house === 'あり' && c.apto !== 'Não'){ s += 2; warn.push(['s.farhouse', {n:Math.round(d)}]); }
    else ng.push(['x.dist', {n:d >= 999 ? '—' : Math.round(d)}]);
  }
  if (cr.house === 'なし' && c.apto === 'Sim') ng.push(['x.nohouse']);
  if (cr.house === 'あり' && c.apto === 'Sim'){ s += 5; ok.push(['s.hsmatch']); }

  if (cr.carReq){
    if (c.car === 'Não') ng.push(['x.car']); else if (!c.car) warn.push(['s.carunk']); else { s += 3; ok.push(['s.car']); }
  } else if (c.car === 'Sim') s += 3;

  const nj = parseInt(c.nihongo, 10);
  if (cr.minjp){
    if (isNaN(nj)) warn.push(['s.jpunk']); else if (nj < cr.minjp) ng.push(['x.jp', {n:nj}]);
  }
  if (!isNaN(nj)){ s += Math.round(nj / 10); if (cr.minjp || nj >= 70) ok.push(['s.jp', {n:nj}]); }
  if (cr.idle && (c.job === 'Não' || c.job === 'Seguro')){ s += 10; ok.push(['s.idle']); }

  const f = factories.find(x => x.id === cr.factoryId);
  if (f && c.gender && slotBlock(f, c.gender)) ng.push(['x.slot']);

  return { c, raw:Math.round(s), score:Math.max(0, Math.min(100, Math.round(s))), ok, warn, ng };
}

const SEARCH_COLS = ['名前','年齢','性別','住まい','電話','連絡アプリ','資格','車','寮','日本語%','現在の仕事','面接日','面接時間','備考'];
const searchRow = c => [c.name, c.age || '', c.gender, c.cityText, c.phone, (c.apps || []).join('・'),
  [ ...(c.cert || []).map(x => CERT_JA[x] || x), ...(c.reach ? ['リーチ'] : []) ].join('・'),
  c.car, c.apto, c.nihongo, c.job, c.interviewDate, c.interviewTime, c.obs];
const ynLabel = v => v ? t('yn.' + v) : '—';
let lastGood = [];

function candidateCard(r, i, cr, f){
  const c = r.c, cls = r.score >= 75 ? 's-great' : r.score >= 55 ? 's-good' : 's-fair';
  const gl = r.score >= 75 ? 'great' : r.score >= 55 ? 'good' : 'fair';
  const quals = qualList(c);
  const info = [
    `${ageDisp(c)} / ${c.gender ? tv(c.gender) : '—'} / ${esc(c.cityText || '—')}`,
    c.phone ? `☎ ${esc(c.phone)}${(c.apps||[]).length ? ' (' + esc(c.apps.join(', ')) + ')' : ''}` : '',
    quals.length ? `🎓 ${esc(quals.join(' / '))}` : '',
    `🚗 ${esc(t('d.car'))}: ${esc(ynLabel(c.car))} ／ 🏠 ${esc(t('d.apto'))}: ${esc(ynLabel(c.apto))} ／ 💼 ${esc(t('d.job'))}: ${esc(ynLabel(c.job))}${c.nihongo !== '' && c.nihongo !== undefined ? ' ／ 🇯🇵 ' + esc(t('d.jp')) + ': ' + esc(c.nihongo) + '%' : ''}`,
    (c.interviewDate || c.interviewTime || c.vaga) ? `📅 ${esc([c.interviewDate, c.interviewTime, c.vaga].filter(Boolean).join(' / '))}` : '',
    c.obs ? `📝 ${esc(c.obs)}` : ''
  ].filter(Boolean).map(x => `<div class="small" style="color:#334155">${x}</div>`).join('');
  let action = '';
  if (c.assigned) action = `<span class="tag">${esc(t('search.placedto',{f:c.assigned}))}</span>`;
  else if (f && canPlace(f)) action = `<button class="btn btn-green btn-sm" data-place="${esc(c.id)}">${esc(t('search.place',{f:f.name}))}</button>`;
  return `<div class="factory-card cand-card ${cls}">
    <div class="factory-name"><span>${i+1}. 👤 ${esc(c.name)} <span class="small">(${esc(t(c._src === 'sheet' ? 'search.src.sheet' : 'search.src.local'))})</span></span><span class="badge ${gl}">${esc(t('pts',{n:r.score}))}</span></div>
    <div class="bar"><div style="width:${r.score}%"></div></div>
    ${info}
    <div class="reasons">
      ${r.ok.map(x => `<div class="ok">✔ ${esc(R(x))}</div>`).join('')}
      ${r.warn.map(x => `<div class="warn">⚠ ${esc(R(x))}</div>`).join('')}
    </div>
    ${action ? `<div class="card-actions">${action}</div>` : ''}
  </div>`;
}

function runSearch(silent){
  const cr = readCriteria();
  const f = factories.find(x => x.id === cr.factoryId);
  const all = candidatePool().map(c => evalCandidate(c, cr));
  const good = all.filter(r => !r.ng.length).sort((x, y) => y.raw - x.raw);
  const out = all.filter(r => r.ng.length).sort((x, y) => y.raw - x.raw);
  lastGood = good;
  if (!silent) clearMsg('msg-search');
  const need = cr.need;
  let html = `<div class="box"><h2>${esc(need ? t('search.found',{m:good.length, n:need}) : t('search.found0',{m:good.length}))}</h2>`;
  if (need && good.length < need) html += `<div class="small" style="color:#b45309">⚠ ${esc(t('search.short'))}</div>`;
  if (cr.locText && !cr.loc) html += `<div class="small" style="color:#b45309">⚠ ${esc(t('search.locunk'))}</div>`;
  if (!good.length) html += `<div class="small">${esc(t('search.none'))}</div>`;
  html += `<div class="btn-row"><button type="button" class="btn btn-sub" id="btn-search-copy">${esc(t('search.copy'))}</button><button type="button" class="btn btn-sub" id="btn-search-csv">${esc(t('search.csv'))}</button></div></div>`;
  html += good.map((r, i) => candidateCard(r, i, cr, f)).join('');
  if (out.length){
    html += `<div class="box"><details><summary>${esc(t('search.excluded',{n:out.length}))}</summary>` +
      out.map(r => `<div class="app-item"><div class="nm">${esc(r.c.name)}</div><div class="sub">${esc(ageDisp(r.c))} / ${esc(r.c.cityText || '—')}</div>
        <div class="reasons">${r.ng.map(x => `<div class="ng">✖ ${esc(R(x))}</div>`).join('')}</div></div>`).join('') + `</details></div>`;
  }
  const box = $('search-results'); box.innerHTML = html; box.dataset.shown = '1';
  $('btn-search-copy').addEventListener('click', () => {
    const tsv = [SEARCH_COLS.join('\t')].concat(lastGood.map(r => searchRow(r.c).map(v => String(nz(v)).replace(/[\t\r\n]+/g, ' ')).join('\t'))).join('\n');
    copyText(tsv, 'msg-search', 'copy.done');
  });
  $('btn-search-csv').addEventListener('click', () => {
    const q = v => '"' + String(nz(v)).replace(/"/g, '""') + '"';
    const csv = [SEARCH_COLS.map(q).join(',')].concat(lastGood.map(r => searchRow(r.c).map(q).join(','))).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'candidates_' + new Date().toISOString().slice(0,10) + '.csv'; a.click(); URL.revokeObjectURL(url);
  });
  box.querySelectorAll('[data-place]').forEach(b => b.addEventListener('click', () => placeFromSearch(b.dataset.place)));
  if (!silent) box.scrollIntoView({behavior:'smooth', block:'start'});
}

async function placeRec(rec, f){
  if (!canPlace(f)) return { err: (f.status === 'closed' ? 'ng.closed' : 'm.full') };
  const blk = slotBlock(f, rec.gender); if (blk) return { err:blk };
  releaseSlot(rec);
  f.current++;
  const usedMale = rec.gender === '男性' && f.maleCap > 0 && maleRem(f) > 0;
  const usedFem  = rec.gender === '女性' && f.femCap > 0 && femRem(f) > 0;
  if (usedMale) f.maleCur++;
  if (usedFem) f.femCur++;
  rec.assigned = f.name; rec.usedMale = usedMale; rec.usedFem = usedFem;
  saveFactories(); saveApplicants();
  return { ok:true, r: await sendToSheet(rec) };
}
async function placeFromSearch(id){
  const f = factories.find(x => x.id === $('s-factory').value); if (!f) return;
  let rec = applicants.find(x => x.id === id);
  if (!rec){
    const r = remoteRows.find(x => x.id === id); if (!r) return;
    rec = {...r}; delete rec._src; applicants.unshift(rec);
    if (String(rec.id).indexOf('H:') === 0){ rec.sentForm = Date.now(); rec.sentKey = payloadKey(rec); }   // 既にシートにある行は再送しない
  }
  const res = await placeRec(rec, f);
  if (res.err){ showMsg('msg-search','err', t(res.err)); return; }
  showMsg('msg-search', res.r === 'error' ? 'err' : 'ok', t('m.decided',{f:f.name, c:f.current, cap:f.capacity}) + sendResultText(res.r, rec));
  fillSearchFactories(); updateSearchSource(); renderApplicants(); runSearch(true);
}
async function openSearchTab(){
  fillSearchFactories(); updateSearchSource();
  if (!remoteLoaded && sheetUrl){
    const ok = await loadRemote(false);
    if (!ok && !autoWarned){ autoWarned = true; showMsg('msg-search','info', t('search.autofail')); }
  }
}
function bindSearch(){
  $('s-factory').addEventListener('change', applyFactoryToSearch);
  $('btn-search').addEventListener('click', () => runSearch(false));
  $('btn-load-remote').addEventListener('click', async () => { await loadRemote(true); if ($('search-results').dataset.shown) runSearch(true); });
  $('btn-search-clear').addEventListener('click', () => {
    ['s-need','s-agemin','s-agemax','s-loc','s-minjp'].forEach(id => $(id).value = '');
    ['s-gender','s-shift','s-house','s-factory'].forEach(id => $(id).value = '');
    $('s-km').value = 20; $('s-car').checked = false; $('s-idle').checked = false; $('s-excl').checked = true;
    document.querySelectorAll('input[name=smust], input[name=sprefer]').forEach(x => { x.checked = false; });
    syncCards();
    $('search-results').innerHTML = ''; delete $('search-results').dataset.shown; clearMsg('msg-search');
  });
}

function setLang(l){
  lang = l;
  try { localStorage.setItem('lang', l); } catch(e){}
  applyStatic(); initSelects(); updateCityHint(); fillSearchFactories(); updateSearchSource(); updateWarn();
  ['msg-form','msg-list','msg-url'].forEach(clearMsg);

    if (a.age && a.gender) renderMatch(a);
  }
  if ($('search-results').dataset.shown) runSearch(true);

$('lang-select').addEventListener('change', e => setLang(e.target.value));

function updateWarn(){
  const w = [], ua = navigator.userAgent || '';
  if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger|Messenger/i.test(ua)) w.push(t('inapp.warn'));
  let ok = true; try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); } catch(e){ ok = false; }
  if (!ok) w.push(t('storage.warn'));
  const el = $('warn-msg'); el.style.display = w.length ? 'block' : 'none'; el.textContent = w.join(' ');
}
applyStatic(); initSelects(); bindForm(); bindSearch(); renderApplicants(); syncCards(); updateWarn();
